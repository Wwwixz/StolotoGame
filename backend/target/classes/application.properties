server.port=8080

# --- PostgreSQL (docker-compose поднимает базу "quickgame") ---
spring.datasource.url=jdbc:postgresql://localhost:5432/quickgame
spring.datasource.username=quickgame
spring.datasource.password=quickgame
spring.datasource.driver-class-name=org.postgresql.Driver

spring.jpa.hibernate.ddl-auto=update
spring.jpa.open-in-view=false
spring.jpa.properties.hibernate.jdbc.time_zone=UTC

# CORS открыт: MVP работает в одном браузере, фронт может жить на другом порту
app.cors.allowed-origins=*

# --- Игровой движок ---
game.draw-seconds=8
game.engine-tick-ms=400
game.auto-host=true
game.auto-host-interval-ms=90000
game.max-open-rooms=6
game.default-wait-seconds=60

logging.level.ru.stoloto.quickgame=INFO
