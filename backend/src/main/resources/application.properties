server.port=${PORT:8080}

# --- PostgreSQL (docker-compose поднимает базу "quickgame") ---
spring.datasource.url=jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5432}/${DB_NAME:quickgame}
spring.datasource.username=${DB_USER:quickgame}
spring.datasource.password=${DB_PASSWORD:quickgame}
spring.datasource.driver-class-name=org.postgresql.Driver

spring.jpa.hibernate.ddl-auto=update
spring.jpa.open-in-view=false
spring.jpa.properties.hibernate.jdbc.time_zone=UTC

# CORS открыт: MVP работает в одном браузере, фронт может жить на другом порту
app.cors.allowed-origins=*

# --- Игровой движок ---
game.draw-seconds=8
game.engine-tick-ms=400
game.auto-host=true
game.auto-host-interval-ms=90000
game.max-open-rooms=6
game.default-wait-seconds=60

logging.level.ru.stoloto.quickgame=INFO
