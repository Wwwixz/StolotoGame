databases:
  - name: stolotoplay-db
    databaseName: quickgame
    user: quickgame
    plan: free
    region: frankfurt

services:
  - type: web
    name: stolotoplay-backend
    runtime: docker
    plan: free
    region: frankfurt
    dockerfilePath: ./backend/Dockerfile
    dockerContext: ./backend
    envVars:
      - key: DB_HOST
        fromDatabase:
          name: stolotoplay-db
          property: host
      - key: DB_PORT
        fromDatabase:
          name: stolotoplay-db
          property: port
      - key: DB_NAME
        fromDatabase:
          name: stolotoplay-db
          property: database
      - key: DB_USER
        fromDatabase:
          name: stolotoplay-db
          property: user
      - key: DB_PASSWORD
        fromDatabase:
          name: stolotoplay-db
          property: password
      - key: GAME_AUTOHOST
        value: "true"

  - type: web
    name: stolotoplay-frontend
    runtime: static
    plan: free
    rootDir: frontend
    buildCommand: npm ci && npm run build
    staticPublishPath: dist
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
